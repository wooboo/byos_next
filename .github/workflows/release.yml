name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_GITHUB: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    # allow tag pushes (head_commit == null) and skip if [skip release] on main
    if: github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      release_version: ${{ steps.bump.outputs.version || steps.version.outputs.version }}
      release_sha: ${{ steps.release_ref.outputs.sha }}
      release_short_sha: ${{ steps.release_ref.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed to read previous version and tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Detect version context
        id: version
        run: |
          # If this is a tag push, just derive version from the tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "from_tag=true" >> "$GITHUB_OUTPUT"
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push (e.g. main)
          CURRENT=$(node -p "require('./package.json').version")

          if git rev-parse HEAD^ >/dev/null 2>&1 && git show HEAD^:package.json >/tmp/prev_package.json 2>/dev/null; then
            PREVIOUS=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/prev_package.json','utf8')).version")
          else
            PREVIOUS="$CURRENT"
          fi

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            # version already bumped in this commit
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          else
            # need to bump
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          fi

          echo "from_tag=false" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump version (patch)
        id: bump
        if: steps.version.outputs.should_bump == 'true'
        run: |
          pnpm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.version.outputs.should_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.version.outputs.should_bump == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json pnpm-lock.yaml || true
          git commit -m "chore(release): v${NEW_VERSION} [skip release]"
          git push origin HEAD

      - name: Resolve release ref
        id: release_ref
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: prepare_release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
      RELEASE_SHORT_SHA: ${{ needs.prepare_release.outputs.release_short_sha }}
      RELEASE_SHA: ${{ needs.prepare_release.outputs.release_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest
            type=raw,value=sha-${{ env.RELEASE_SHORT_SHA }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
      RELEASE_SHA: ${{ needs.prepare_release.outputs.release_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Create tag (for branch pushes)
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="v${RELEASE_VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping creation."
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${RELEASE_VERSION}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --target "$RELEASE_SHA" \
            --verify-tag \
            --generate-notes
